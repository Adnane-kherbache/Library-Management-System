{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card text-center p-4">
            <div class="card-body py-5">
                <div class="empty-state-icon text-warning mb-3" style="width: 80px; height: 80px; font-size: 2.5rem; background: rgba(245, 158, 11, 0.1);">
                    <i class="bi bi-compass"></i>
                </div>
                <h1 class="display-3 fw-bold mb-2">404</h1>
                <h3 class="fw-bold mb-3">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The requested library catalog page or resource could not be found. It may have been archived or moved.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="bi bi-house"></i> Return to Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
