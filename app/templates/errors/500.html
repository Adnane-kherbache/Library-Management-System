{% extends "base.html" %}

{% block title %}500 — Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card text-center p-4">
            <div class="card-body py-5">
                <div class="empty-state-icon text-danger mb-3" style="width: 80px; height: 80px; font-size: 2.5rem; background: rgba(244, 63, 94, 0.1);">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h1 class="display-3 fw-bold mb-2">500</h1>
                <h3 class="fw-bold mb-3">Internal Server Error</h3>
                <p class="text-muted mb-4">
                    An unexpected error occurred while processing your request. The transaction has been rolled back safely.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="bi bi-house"></i> Return to Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
