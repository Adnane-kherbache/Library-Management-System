{% extends "base.html" %}

{% block title %}403 — Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card text-center p-4">
            <div class="card-body py-5">
                <div class="empty-state-icon text-warning mb-3" style="width: 80px; height: 80px; font-size: 2.5rem; background: rgba(245, 158, 11, 0.1);">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h1 class="display-3 fw-bold mb-2">403</h1>
                <h3 class="fw-bold mb-3">Access Forbidden</h3>
                <p class="text-muted mb-4">
                    You do not have administrative permission to access this library system resource.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                        <i class="bi bi-house"></i> Return to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
